<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
       div.container{
        display: flex;
        background-color: brown;
        flex-flow: row wrap;
       }

       div.item{
        background-color: aqua;
        border: 1px solid black;
        text-align: center;
        padding: 20px;
       }

       div#i1{
        order: -1;
       }
       
       div#i2{
        order: 3;
       }

       div#i3{
        order: 2;
       }

       div#i4{
        order: 1;
       }

       div#i5{
        order: 0;
       }

       div#i6{
        order: -3;
       }

       div#i7{
        order: -2;
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">L</div>
        <div class="item" id="i2">S</div>
        <div class="item" id="i3">A</div>
        <div class="item" id="i4">N</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">M</div>
        <div class="item" id="i7">I</div>
    </div>
</body>
</html>
