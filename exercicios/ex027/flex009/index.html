<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
       div.container{
        display: flex;
        background-color: brown;
        flex-flow: row wrap;
       }

       div.item{
        background-color: aqua;
        border: 1px solid black;
        text-align: center;
        flex-basis: 200px;
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Outro conteúdo</div>
        <div class="item">C</div>
        <div class="item">Contéudo um pouco maior</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">Contéudo maior ainda que vai ocupar mais espaço</div>
    </div>
</body>
</html>
