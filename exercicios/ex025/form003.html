<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário 003</title>
  </head>
  <body>
    <h1>Teste de formulário</h1>
    <hr/>

    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" minlength="3" maxlength="25" size="11" placeholder="Digite um nome" required autocomplete="name">
        </p>
        <p>
          <label for="imedia">Média: </label>
          <input type="number" name="media" id="imedia" step="0.1" placeholder="Media" min="0" max="10" required value="0">
        </p>
        <p>
          <label for="imes">Período letivo: </label>
          <input type="month" name="mes" id="imes" value="2025-04">
        </p>
        <p>
          <label for="idata">Dia Prova:</label>
          <input type="date" name="data" id="idata" value="2000-04-01">
        </p>
        <p><label for="ihorario">Horario Prova:</label>
          <input type="time" name="horario" id="ihorario" required value="00:00">
        </p>
        <p>
          <input type="reset" value="Limpar">
          <input type="submit" value="Enviar">
        </p>
    </form>
  </body>
</html>
