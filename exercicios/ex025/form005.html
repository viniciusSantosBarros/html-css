<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário 005</title>
  </head>
  <body>
   <h1>Formulário 005</h1>
   <hr>

   <form action="cadastro.php" method="get">
    <fieldset style="width: 200px;">
        <legend style="text-align: center;">Esportes Favoritos</legend>
        <p>
            <input type="checkbox" name="fut" id="ifut" checked> <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="basq" id="ibasq"> <label for="ibasq">Basquete</label> <br>
            <input type="checkbox" name="tenis" id="itenis" checked> <label for="itenis">Tenis</label> <br>
            <input type="checkbox" name="volei" id="ivolei"> <label for="ivolei">Volei</label>
        </p>
    </fieldset>

    <fieldset style="width: 200px;">
        <legend style="text-align: center;">Sexo</legend>
        <p>
        
            <input type="radio" name="sexo" id="imasc" value="M"> <label for="imasc">Masculino</label> <br>
            <input type="radio" name="sexo" id="ifem" value="F" checked> <label for="ifem">Feminino</label>
        </p>
    </fieldset>

    <p>
        <input type="reset" value="Limpar">
        <input type="submit" value="Enviar">
    </p>
   </form>

  </body>
</html>
