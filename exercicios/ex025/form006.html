<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário 006</title>
  </head>
  <body>
    <h1>Formulário</h1>
    <hr />
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="cor" id="icor" value="#00ff00">
        </p>
        <p>
            <label for="irange">Nivel de satisfação: </label>
            <input type="range" name="range" id="irange" min="1" max="5" value="2">
        </p>
        <p>
            <label for="ifile">Foto do Perfil: </label>
            <input type="file" name="file" id="ifile">
        </p>
        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
  </body>
</html>
