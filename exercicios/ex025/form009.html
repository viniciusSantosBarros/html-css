<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 009</title>
</head>
<body>
    <h1>Formulário 009</h1>
    <hr>

    <form action="cadastro.php" method="get">

        <p>
            <label for="irange">Número: </label>
            <input type="range" name="range" id="irange" min="0" max="10" value="0" oninput="ival.innerHTML = Number(irange.value)">
            <output id="ival">0</output>
        </p>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>

    </form>
</body>
</html>
