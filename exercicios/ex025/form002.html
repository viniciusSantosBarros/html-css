<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário 002</title>
  </head>
  <body>
    <h1>Teste de Formuláio</h1>
    <hr/>

    <form action="cadastro.php" method="post" autocomplete="on">
      
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="10" size="15" placeholder="Nome do usuário" autocomplete="username">
        </p>

        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" required minlength="3" maxlength="8" size="15" placeholder="Minimo 03 letras" autocomplete="current-password">
        </p>
        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>




    </form>
  </body>
</html>
