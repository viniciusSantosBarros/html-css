<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário 008</title>
  </head>
  <body>
    <h1>Formulário</h1>
    <hr />
    <form action="cadastro.php" method="get">
      <p>
        <label for="inum1">Número 01: </label>
        <input type="number" name="num1" id="inum1" min="0" max="10" required oninput="isoma.innerHTML = Number(inum1.value) + Number(inum2.value)" />
      </p>

      <p>
        <label for="inum2">Número 02:</label>
        <input type="number" name="num2" id="inum2" min="0" max="10" required oninput="isoma.innerHTML = Number(inum1.value) + Number(inum2.value)" />
      </p>
      
      <p>
        <label for="isoma">Soma: </label>
        <output name="soma" id="isoma">0</output>
      </p>

      <p>
        <input type="reset" value="Limpar" />
        <input type="submit" value="Enviar" />
      </p>
    </form>
  </body>
</html>
